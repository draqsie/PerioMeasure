tr.welcome.text=Ölçmek istediğiniz fotoğrafı “Fotoğraf aç” ile seçin ya da dosyayı bu pencereye sürükleyip bırakın.\n\nDenemek için “Deneme yüzü”nü kullanın: gerçek değerleri bilinen yapay bir yüz açılır ve sonuçlarınız bunlarla karşılaştırılır.\n\nFotoğraflar yalnızca okunur; değiştirilmez ve hiçbir yere gönderilmez.
en.welcome.text=Choose the photo to measure with “Open photo” or drag the file onto this window.\n\nTo try it out, use “Demo face”: a synthetic face with known true values opens and your results are compared with them.\n\nPhotos are only read; they are never changed or sent anywhere.
